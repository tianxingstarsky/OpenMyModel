<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务仪表盘 · OpenMyModel</title><style>
:root{--bg:#f5f7f6;--line:#e6ece9;--ink:#172421;--muted:#7b8985;--green:#087f6e;--pale:#e7f4f0;--shadow:0 8px 24px #263b3210}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1280px;margin:auto;padding:0 26px}.top .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:750}.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--green);border-radius:10px;color:#fff}.brand small{display:block;font-size:10px;color:#98a39f;font-weight:500}.links{display:flex;align-items:center;gap:9px}.links a{padding:7px 11px;text-decoration:none;color:#60706a;font-size:11px;border:1px solid var(--line);border-radius:8px}.links a:first-child{background:var(--green);color:white;border-color:var(--green)}main{padding:33px 0 60px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:21px}.head h1{font-size:26px;margin:0 0 5px;letter-spacing:-.6px}.head p{font-size:12px;color:var(--muted);margin:0}.stamp{font-size:11px;color:#8d9995}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.metric{display:flex;justify-content:space-between}.label{color:var(--muted);font-size:11px}.value{font-size:24px;font-weight:740;letter-spacing:-.5px;margin-top:8px}.sub{color:#9aa6a1;font-size:10px;margin-top:4px}.icon{background:var(--pale);color:var(--green);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}.cols{grid-template-columns:minmax(0,1.5fr) minmax(270px,.85fr)}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title h2{font-size:13px;margin:0}.muted{color:var(--muted);font-size:10px}.chart{width:100%;height:240px}.models{display:grid;gap:12px}.model{display:grid;grid-template-columns:1fr auto;gap:6px}.bar{grid-column:1/-1;height:5px;border-radius:4px;background:#edf2ef}.bar i{height:100%;display:block;background:#0b8974;border-radius:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;text-align:left;min-width:600px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #edf1ef;white-space:nowrap}.table th{font-size:10px;color:#899691;background:#fafcfb}.table td{font-size:11px;color:#52615a}.table tr:last-child td{border:0}.empty{padding:30px;text-align:center;color:#99a49f;font-size:12px}.foot{margin-top:17px;text-align:right;color:#a0aaa6;font-size:10px}@media(max-width:760px){.wrap{padding:0 15px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.chart{height:200px}.head h1{font-size:22px}}@media(max-width:420px){.head{align-items:flex-start;flex-direction:column;gap:8px}.links a{padding:6px 8px}}
</style></head><body><header class="top"><div class="wrap"><div class="brand"><span class="mark">O</span><span>OpenMyModel<small>AI 推理网关</small></span></div><div class="links"><a href="/admin">管理端</a><a href="/console">用户控制台</a></div></div></header><main class="wrap"><div class="head"><div><h1>平台仪表盘</h1><p>服务运行状态与近 24 小时的聚合用量。</p></div><span class="stamp" id="updated">加载中…</span></div><div class="grid stats" id="stats"></div><div class="grid cols"><div class="card"><div class="title"><h2>请求量趋势</h2><span class="muted">最近 24 小时</span></div><canvas id="chart" class="chart"></canvas></div><div class="card"><div class="title"><h2>模型调用分布</h2><span class="muted">请求数</span></div><div class="models" id="models"></div></div></div><div class="card" style="margin-top:15px"><div class="title"><h2>节点模型状态</h2><span class="muted">只展示聚合数据</span></div><div id="nodes"></div></div><div class="foot">用量数据由 OpenMyModel 网关汇总</div></main><script>
const $=s=>document.querySelector(s),esc=value=>String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"),fmt=n=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:1}).format(Number(n||0));async function load(){try{const r=await fetch('/api/public/dashboard');if(r.status===404){$('#updated').textContent='当前使用服务商模式';$('#stats').innerHTML='<div class="card" style="grid-column:1/-1;color:#7b8985">公开仪表盘已关闭。用户请登录自己的<a href="/console" style="color:#087f6e">开发者控制台</a>查看用量。</div>';return}if(!r.ok)throw Error('数据暂不可用');const d=await r.json();$('#updated').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#stats').innerHTML=[['近 24 小时请求',d.requests,fmt(d.requestsPerMinute)+' 次 / 分钟 · 当前'],['输入 Token',d.input,'近 24 小时'],['输出 Token',d.output,'近 24 小时'],['在线节点',`${d.onlineNodes} / ${d.totalNodes}`,'当前就绪节点']].map(x=>`<div class="card"><div class="metric"><div><div class="label">${x[0]}</div><div class="value">${typeof x[1]==='string'?esc(x[1]):fmt(x[1])}</div><div class="sub">${x[2]}</div></div><div class="icon">◫</div></div></div>`).join('');draw(d.hourly||[]);$('#models').innerHTML=d.models?.length?d.models.map((m,i)=>`<div class="model"><b>${esc(m.model)}</b><span class="muted">${fmt(m.requests)} 次</span><div class="bar"><i style="width:${Math.max(3,100*m.requests/Math.max(...d.models.map(x=>x.requests),1))}%;background:${['#087f6e','#49aa95','#9acfc0','#d9b24f'][i%4]}"></i></div></div>`).join(''):'<div class="empty">暂无请求记录</div>';const ms=d.tunnel?.models||[];$('#nodes').innerHTML=ms.length?`<div class="table-wrap"><table class="table"><thead><tr><th>节点模型</th><th>连接节点</th><th>就绪节点</th><th>活动请求</th><th>累计请求</th></tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.model)}</b></td><td>${m.nodes}</td><td>${m.readyNodes}</td><td>${m.activeRequests}</td><td>${fmt(m.totalRequests)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无在线节点</div>'}catch{$('#updated').textContent='数据暂不可用'}}function draw(rows){const c=$('#chart'),ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;ctx.scale(r,r);const vals=Array.from({length:24},(_,i)=>{const key=new Date(Date.now()-(23-i)*3600000).toISOString().slice(0,13);return Number(rows.find(x=>x.hour===key)?.requests||0)}),max=Math.max(...vals,4),l=38,b=26,t=12,cw=w-l-8,ch=h-t-b;ctx.font='10px system-ui';for(let j=0;j<4;j++){let y=t+ch*j/3;ctx.strokeStyle='#edf1ef';ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(w-8,y);ctx.stroke();ctx.fillStyle='#95a19d';ctx.textAlign='right';ctx.fillText(fmt(Math.round(max*(1-j/3))),l-8,y+3)}let pts=vals.map((v,i)=>[l+cw*i/23,t+ch-(v/max)*ch]);let g=ctx.createLinearGradient(0,t,0,h-b);g.addColorStop(0,'#b8e1d4aa');g.addColorStop(1,'#eaf6f1aa');ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineTo(pts.at(-1)[0],h-b);ctx.lineTo(pts[0][0],h-b);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle='#088473';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='center';for(let i=0;i<24;i+=4){ctx.fillStyle='#87948f';ctx.fillText(new Date(Date.now()-(23-i)*3600000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),l+cw*i/23,h-7)}}load();setInterval(load,30000);
</script></body></html>
