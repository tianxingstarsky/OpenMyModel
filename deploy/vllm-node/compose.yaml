name: openmymodel-vllm-node

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    restart: unless-stopped
    ipc: host
    gpus: all
    expose:
      - "8000"
    environment:
      VLLM_API_KEY: ${NODE_API_KEY:?Set NODE_API_KEY in .env}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
    command:
      - --model
      - ${VLLM_MODEL:?Set VLLM_MODEL in .env}
      - --served-model-name
      - ${PUBLIC_MODEL_NAME:?Set PUBLIC_MODEL_NAME in .env}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

  connector:
    build:
      context: ../..
      dockerfile: deploy/vllm-node/Dockerfile.connector
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      CLOUD_URL: ${CLOUD_URL:?Set CLOUD_URL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NODE_ID: ${NODE_ID:?Set NODE_ID in .env}
      NODE_NAME: ${NODE_NAME:?Set NODE_NAME in .env}
      PUBLIC_MODEL_NAME: ${PUBLIC_MODEL_NAME:?Set PUBLIC_MODEL_NAME in .env}
      NODE_API_KEY: ${NODE_API_KEY:?Set NODE_API_KEY in .env}
      VLLM_URL: http://vllm:8000

volumes:
  huggingface-cache:
